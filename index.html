<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <title>碼表</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; color: #1d1d1f; background: #f5f5f7; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 28px 18px; }
    main { width: 100%; max-width: 420px; padding: 38px 32px 32px; border: 1px solid #fff; border-radius: 32px; background: #fff; box-shadow: 0 24px 70px #1d1d1f0a, 0 3px 10px #1d1d1f03; text-align: center; }
    h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: .08em; }
    .subtitle { margin: 10px 0 30px; font-size: 13px; color: #86868b; letter-spacing: .06em; }
    .dial { --angle: 0deg; position: relative; width: min(100%, 292px); aspect-ratio: 1; margin: 0 auto 30px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(from 0deg, #007aff var(--angle), #ededf0 0); padding: 5px; }
    .face { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: inset 0 0 0 9px #fff, inset 0 0 0 10px #f1f1f4; }
    .unit { margin-bottom: 12px; font-size: 10px; letter-spacing: .15em; color: #86868b; }
    #time { font-size: clamp(30px, 9vw, 43px); font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -.04em; white-space: nowrap; }
    #status { margin-top: 14px; font-size: 12px; color: #86868b; }
    .controls { width: 100%; max-width: 240px; margin: auto; display: grid; gap: 12px; }
    button { min-height: 52px; border: 0; border-radius: 15px; font: inherit; font-size: 16px; font-weight: 500; cursor: pointer; transition: background .18s, transform .18s; touch-action: manipulation; }
    button:active:not(:disabled) { transform: scale(.98); }
    button:focus-visible { outline: 3px solid #007aff; outline-offset: 4px; }
    #toggle { background: #007aff; color: #fff; }
    #toggle:hover { background: #0068dc; }
    #toggle[data-running="true"] { background: #fff1df; color: #a85b00; }
    #reset { min-height: 46px; background: #f0f0f3; color: #515154; font-size: 14px; }
    #reset:hover:not(:disabled) { background: #e5e5ea; }
    #reset:disabled { color: #b5b5bc; background: #f7f7f9; cursor: default; }
    @media (max-width: 360px) { main { padding: 30px 20px 24px; } }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <h1 id="title">碼表</h1>
    <p class="subtitle">專注此刻，記錄每一秒。</p>
    <div class="dial" id="dial">
      <div class="face">
        <span class="unit">分 : 秒 . 百分秒</span>
        <output id="time" role="timer" aria-label="經過時間" aria-live="off">00:00.00</output>
        <span id="status" role="status">準備就緒</span>
      </div>
    </div>
    <div class="controls">
      <button id="toggle" type="button">開始</button>
      <button id="reset" type="button" disabled>重置</button>
    </div>
  </main>
  <script>
    const toggle = document.getElementById('toggle');
    const reset = document.getElementById('reset');
    const time = document.getElementById('time');
    const status = document.getElementById('status');
    const dial = document.getElementById('dial');
    let running = false;
    let elapsed = 0;
    let startedAt = 0;
    let frameId = null;

    function render(milliseconds) {
      const hundredths = Math.floor(milliseconds / 10);
      const minutes = Math.floor(hundredths / 6000);
      const seconds = Math.floor(hundredths / 100) % 60;
      time.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(hundredths % 100).padStart(2, '0')}`;
      dial.style.setProperty('--angle', `${(milliseconds % 60000) / 60000 * 360}deg`);
    }

    function tick() {
      if (!running) return;
      render(elapsed + performance.now() - startedAt);
      frameId = requestAnimationFrame(tick);
    }

    toggle.addEventListener('click', () => {
      if (running) {
        elapsed += performance.now() - startedAt;
        running = false;
        cancelAnimationFrame(frameId);
        render(elapsed);
        toggle.textContent = '開始';
        status.textContent = '已暫停';
      } else {
        startedAt = performance.now();
        running = true;
        toggle.textContent = '暫停';
        status.textContent = '計時中';
        reset.disabled = false;
        tick();
      }
      toggle.dataset.running = String(running);
    });

    reset.addEventListener('click', () => {
      running = false;
      cancelAnimationFrame(frameId);
      elapsed = 0;
      toggle.textContent = '開始';
      toggle.dataset.running = 'false';
      reset.disabled = true;
      status.textContent = '準備就緒';
      render(0);
    });
    render(0);
  </script>
</body>
</html>
